[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usloc"
version = "0.0.1"
description = "Automatic liver-lesion detection, classification and segmentation from CEUS/RF ultrasound"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Puneeth GV" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # long lines tolerated in comments / URLs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["needs_data: test requires the mounted ultrasound dataset to be present"]
